services:
    chromadb:
        container_name: chromadb
        image: chromadb/chroma:latest
        volumes:
            - chroma_persist_storage:${PERSIST_DIRECTORY}
        ports:
            - '8000:8000'
        env_file:
            - ./.env

    elasticsearch:
        container_name: elasticsearch
        image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
        environment:
            - discovery.type=single-node
            - xpack.security.enabled=false
            - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
        volumes:
            - es_persist_storage:/usr/share/elasticsearch/data
        ports:
            - "9200:9200"
        healthcheck:
            test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'"]
            interval: 10s
            timeout: 5s
            retries: 10

    ingest:
        container_name: ingest
        build:
            context: ./ingest
            dockerfile: Dockerfile.ingest
        depends_on:
            - chromadb
            - elasticsearch
        volumes:
            - ./seed_data:/ingest/dataset_md
        env_file:
            - ./.env

    api:
        container_name: api
        build:
            context: ./api
            dockerfile: Dockerfile
        depends_on:
            - chromadb
            - elasticsearch
        ports:
            - '8002:80' # Expose the API on port 8002 of the host machine
        env_file:
            - ./.env

    front_chat:
        build: ./front-chat
        ports:
            - "8501:8501"
        env_file:
            - ./front-chat/.env
        depends_on:
            - backend_api

    backend_api:
        build: ./backend-api
        ports:
            - "8001:8000"
        env_file:
            - ./backend-api/.env

    eval_dashboard:
        container_name: eval_dashboard
        build: ./eval-dashboard
        ports:
            - "8502:8502"
        env_file:
            - ./eval-dashboard/.env
        depends_on:
            - api

volumes:
    chroma_persist_storage:
    es_persist_storage:
